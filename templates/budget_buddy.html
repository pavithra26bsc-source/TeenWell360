<footer>
    <p>TeenWell360 | Eat Smart. Spend Smart!</p>
</footer>

<script>
function generatePlan() {

    const budget = Number(document.getElementById("budget").value);
    const days = Number(document.getElementById("days").value);
    const result = document.getElementById("result");

    if (!budget || budget <= 0) {
        result.style.display = "block";
        result.innerHTML =
            "<div class='meal'>Please enter a valid daily budget.</div>";
        return;
    }

    const total = budget * days;

    const breakfast = Math.round(budget * 0.20);
    const lunch = Math.round(budget * 0.35);
    const snack = Math.round(budget * 0.10);
    const dinner = budget - breakfast - lunch - snack;

    result.style.display = "block";

    result.innerHTML = `
        <h2>🎉 Your Budget Plan</h2>

        <div class="meal">
            <h3>💰 Budget Summary</h3>
            Daily Budget: <span class="amount">₹${budget}</span><br>
            Planning Period: ${days} day(s)<br>
            Total Budget: <span class="amount">₹${total}</span>
        </div>

        <h3>🍽️ Daily Meal Budget</h3>

        <div class="meal">
            🌞 Breakfast
            <span class="amount">₹${breakfast}</span>
            <p>Idli with sambar, vegetable upma or banana with milk.</p>
        </div>

        <div class="meal">
            ☀️ Lunch
            <span class="amount">₹${lunch}</span>
            <p>Rice, dal or sambar, seasonal vegetables and curd.</p>
        </div>

        <div class="meal">
            🍎 Evening Snack
            <span class="amount">₹${snack}</span>
            <p>Seasonal fruit or roasted chana.</p>
        </div>

        <div class="meal">
            🌙 Dinner
            <span class="amount">₹${dinner}</span>
            <p>Chapati with dal, vegetable dosa or a balanced rice meal.</p>
        </div>

        <p class="note">
            These are suggested budget allocations, not fixed food prices.
            Actual costs depend on your location and available ingredients.
            Adjust the plan according to your needs and the food available at home.
        </p>
    `;
}
</script>

</body>
</html>
